[package]
name = "rustopoly-server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
clap = { version = "3.0", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rustopoly-interface = { path = "../rustopoly-interface"}
tokio = { version = "1", features = ["net", "full"] }
thiserror = {version = "2"}